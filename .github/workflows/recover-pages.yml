name: Recover stalled Pages deployment

on:
  push:
    branches: [main]
    paths: ['.github/workflows/recover-pages.yml']
  workflow_dispatch:

permissions:
  pages: write

jobs:
  cancel-stale-deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Cancel the previous stalled Pages deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/Julia0613/matrix/pages/deployments/f2b0ca8823669e93b2a7fda2e1f6b66e35d24df6/cancel"
